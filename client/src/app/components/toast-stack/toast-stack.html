<div class="fixed top-4 right-4 z-[100] flex flex-col gap-2 w-[calc(100%-2rem)] max-w-sm">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="animate-toast-in flex items-start gap-3 rounded-sm border border-slate-700 bg-black text-white px-4 py-3 shadow-xl">
      <lucide-icon [img]="CircleCheckBig" class="h-5 w-5 flex-shrink-0 text-accent mt-0.5" />
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold leading-tight">{{ toast.title }}</p>
        @if (toast.description) {
          <p class="text-xs text-slate-300 mt-0.5 leading-snug">{{ toast.description }}</p>
        }
      </div>
      <button
        (click)="toastService.dismissToast(toast.id)"
        class="flex-shrink-0 text-slate-400 hover:text-white transition-colors"
        aria-label="Fechar notificação"
      >
        <lucide-icon [img]="X" class="h-4 w-4" />
      </button>
    </div>
  }
</div>
