<div>
  <div class="mb-8">
    <h1 class="text-2xl font-black tracking-tight text-white">Configurações</h1>
    <p class="mt-1 text-sm text-slate-500">Ajustes gerais da loja.</p>
  </div>

  <form (submit)="handleSubmit($event)" class="flex max-w-xl flex-col gap-6">
    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
        Nome da loja
      </label>
      <input
        [value]="storeName()"
        (input)="storeName.set($any($event.target).value)"
        class="w-full rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white focus:border-yellow-400 focus:outline-none"
      />
      <p class="mt-1.5 text-xs text-slate-600">
        Aparece na navbar, rodapé, aba do navegador e no painel admin.
      </p>
    </div>

    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
        Frete grátis a partir de (R$)
      </label>
      <input
        [value]="threshold()"
        (input)="threshold.set($any($event.target).value)"
        inputmode="decimal"
        class="w-full max-w-xs rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white focus:border-yellow-400 focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
        Mensagens da barra de anúncio
      </label>
      <div class="flex gap-2">
        <input
          [value]="messageInput()"
          (input)="messageInput.set($any($event.target).value)"
          (keydown)="onMessageInputKeydown($event)"
          placeholder="Ex: Novidades toda semana"
          class="flex-1 rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
        />
        <button
          type="button"
          (click)="addMessage()"
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg border border-slate-700 text-white transition-colors duration-300 hover:border-white"
          aria-label="Adicionar mensagem"
        >
          <lucide-icon [img]="Plus" class="h-4 w-4" />
        </button>
      </div>
      <p class="mt-1.5 text-xs text-slate-600">
        A mensagem de frete grátis é gerada automaticamente a partir do valor acima.
      </p>
      @if (messages().length > 0) {
        <ul class="mt-3 flex flex-col gap-2">
          @for (msg of messages(); track $index) {
            <li class="flex items-center justify-between rounded-lg border border-slate-800 bg-slate-950 px-4 py-2 text-sm text-slate-300">
              {{ msg }}
              <button
                type="button"
                (click)="removeMessage($index)"
                aria-label="Remover mensagem"
                class="text-slate-500 hover:text-white"
              >
                <lucide-icon [img]="X" class="h-4 w-4" />
              </button>
            </li>
          }
        </ul>
      }
    </div>

    <button
      type="submit"
      [disabled]="saving()"
      class="self-start rounded-full bg-yellow-400 px-6 py-3 text-xs font-bold uppercase tracking-wide text-slate-900 transition-colors duration-300 hover:bg-white disabled:opacity-60"
    >
      {{ saving() ? 'Salvando...' : 'Salvar configurações' }}
    </button>
  </form>
</div>
