<div class="fixed inset-0 z-[60] bg-slate-900/70" (click)="formClose.emit()" aria-hidden="true"></div>
<aside class="fixed right-0 top-0 z-[70] flex h-full w-full max-w-lg animate-slide-in flex-col overflow-y-auto border-l border-slate-800 bg-black">
  <div class="flex items-center justify-between border-b border-slate-800 px-6 py-4">
    <h2 class="text-base font-bold text-white">{{ isEditing() ? 'Editar Produto' : 'Novo Produto' }}</h2>
    <button
      (click)="formClose.emit()"
      class="flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition-colors duration-300 hover:bg-slate-900 hover:text-white"
      aria-label="Fechar"
    >
      <lucide-icon [img]="X" class="h-5 w-5" />
    </button>
  </div>

  <form (submit)="handleSubmit($event)" class="flex flex-1 flex-col gap-5 px-6 py-6">
    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
        Foto do produto
      </label>
      <div class="flex items-center gap-4">
        <div class="flex h-24 w-20 flex-shrink-0 items-center justify-center overflow-hidden rounded-lg border border-slate-800 bg-slate-900">
          @if (image()) {
            <img [src]="image()" alt="" class="h-full w-full object-cover" />
          } @else {
            <lucide-icon [img]="Upload" class="h-5 w-5 text-slate-600" />
          }
        </div>
        <label class="flex cursor-pointer items-center justify-center rounded-full border border-slate-700 px-4 py-2 text-xs font-bold uppercase tracking-wide text-white transition-colors duration-300 hover:border-white">
          {{ uploading() ? 'Processando...' : image() ? 'Trocar foto' : 'Enviar foto' }}
          <input
            type="file"
            accept="image/*"
            class="hidden"
            (change)="handleFileChange($event)"
            [disabled]="uploading()"
          />
        </label>
      </div>
    </div>

    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">Nome</label>
      <input
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        placeholder="Ex: Camisa Oversized Concrete"
        class="w-full rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
          Categoria
        </label>
        <select
          [value]="category()"
          (change)="category.set($any($event.target).value)"
          class="w-full rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white focus:border-yellow-400 focus:outline-none"
        >
          @for (opt of categoryOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </div>
      <div>
        <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
          Preço (R$)
        </label>
        <input
          [value]="price()"
          (input)="price.set($any($event.target).value)"
          inputmode="decimal"
          placeholder="149,90"
          class="w-full rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
        />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
          Desconto (%)
        </label>
        <input
          [value]="discountPercent()"
          (input)="discountPercent.set($any($event.target).value)"
          inputmode="decimal"
          placeholder="Opcional"
          class="w-full rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
        />
      </div>
      <label class="flex items-center gap-2.5 self-end pb-2.5 text-sm font-medium text-slate-300">
        <input
          type="checkbox"
          [checked]="isNew()"
          (change)="isNew.set($any($event.target).checked)"
          class="h-4 w-4 rounded border-slate-700 bg-slate-950 accent-yellow-400"
        />
        Marcar como novidade
      </label>
    </div>

    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">Tamanhos</label>
      <div class="flex gap-2">
        <input
          [value]="sizeInput()"
          (input)="sizeInput.set($any($event.target).value)"
          (keydown)="onSizeInputKeydown($event)"
          placeholder="Ex: P, M, G..."
          class="flex-1 rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
        />
        <button
          type="button"
          (click)="addSize()"
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg border border-slate-700 text-white transition-colors duration-300 hover:border-white"
          aria-label="Adicionar tamanho"
        >
          <lucide-icon [img]="Plus" class="h-4 w-4" />
        </button>
      </div>

      <div class="mt-3 flex items-center gap-3">
        <label class="text-xs font-medium text-slate-500">Estoque inicial por tamanho novo</label>
        <input
          type="number"
          min="0"
          [value]="initialStock()"
          (input)="initialStock.set($any($event.target).value)"
          class="w-16 rounded-lg border border-slate-800 bg-slate-950 px-2 py-1.5 text-center text-sm text-white focus:border-yellow-400 focus:outline-none"
        />
      </div>

      @if (sizes().length > 0) {
        <div class="mt-3 flex flex-wrap gap-1.5">
          @for (size of sizes(); track size) {
            <span class="flex items-center gap-1.5 rounded-full border border-slate-700 py-1 pl-3 pr-2 text-xs font-semibold text-white">
              {{ size }}
              <button
                type="button"
                (click)="removeSize(size)"
                [attr.aria-label]="'Remover tamanho ' + size"
                class="text-slate-500 hover:text-white"
              >
                <lucide-icon [img]="X" class="h-3 w-3" />
              </button>
            </span>
          }
        </div>
      }
    </div>

    <div>
      <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-slate-400">
        Descrição
      </label>
      <textarea
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        rows="3"
        placeholder="Descreva o produto..."
        class="w-full resize-none rounded-lg border border-slate-800 bg-slate-950 px-4 py-2.5 text-sm text-white placeholder:text-slate-600 focus:border-yellow-400 focus:outline-none"
      ></textarea>
    </div>

    @if (error()) {
      <p class="text-xs font-medium text-red-500">{{ error() }}</p>
    }

    <div class="flex gap-3 pt-2">
      <button
        type="button"
        (click)="formClose.emit()"
        class="flex-1 rounded-full border border-slate-700 py-3 text-sm font-bold uppercase tracking-wide text-white transition-colors duration-300 hover:border-white"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="flex-1 rounded-full bg-yellow-400 py-3 text-sm font-bold uppercase tracking-wide text-slate-900 transition-colors duration-300 hover:bg-white"
      >
        {{ isEditing() ? 'Salvar alterações' : 'Adicionar produto' }}
      </button>
    </div>
  </form>
</aside>
