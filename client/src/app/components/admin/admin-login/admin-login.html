<div class="flex min-h-screen items-center justify-center bg-black px-4">
  <form (submit)="handleSubmit($event)" class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-950 p-8">
    <div class="flex items-center gap-2.5 text-white">
      <span class="flex h-9 w-9 items-center justify-center rounded-full border border-slate-700 text-[11px] font-black tracking-tight">
        {{ storeInitials(settingsService.settings().storeName) }}
      </span>
      <span class="text-lg font-black tracking-tighter">
        {{ wordmark().lead ? wordmark().lead + ' ' : '' }}
        <span class="text-yellow-400">{{ wordmark().accent }}</span>
      </span>
    </div>

    <h1 class="mt-6 text-xl font-black text-white">Painel Admin</h1>
    <p class="mt-1 text-sm text-slate-500">Entre com a senha para gerenciar o catálogo.</p>

    <input
      type="password"
      autofocus
      [value]="password()"
      (input)="onPasswordChange($any($event.target).value)"
      placeholder="Senha"
      class="mt-6 w-full rounded-full border bg-black px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none"
      [class]="error() ? 'border-red-500' : 'border-slate-700 focus:border-yellow-400'"
    />
    @if (error()) {
      <p class="mt-2 text-xs font-medium text-red-500">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="mt-5 w-full rounded-full bg-yellow-400 py-3 text-sm font-bold uppercase tracking-wide text-slate-900 transition-colors duration-300 hover:bg-white disabled:opacity-60"
    >
      {{ submitting() ? 'Entrando...' : 'Entrar' }}
    </button>

    <a
      routerLink="/"
      class="mt-5 block text-center text-xs text-slate-600 transition-colors duration-300 hover:text-slate-300"
    >
      Voltar para a loja
    </a>
  </form>
</div>
