<div class="flex flex-wrap gap-2">
  @for (filter of filters; track filter.value) {
    <button
      (click)="categoryChange.emit(filter.value)"
      class="flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold transition-all duration-300"
      [class]="activeCategory() === filter.value
        ? 'bg-white text-black'
        : 'bg-black text-slate-400 border border-slate-700 hover:border-white hover:text-white'"
    >
      {{ filter.label }}
      <span [class]="activeCategory() === filter.value ? 'text-slate-500' : 'text-slate-600'">
        {{ counts()[filter.value] }}
      </span>
    </button>
  }
</div>
