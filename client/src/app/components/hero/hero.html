<section class="relative overflow-hidden bg-black">
  <div class="absolute inset-0">
    <img
      src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=1600&auto=format&fit=crop&q=80"
      alt=""
      class="h-full w-full object-cover opacity-40"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/85 to-black/30"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-black via-black/50 to-transparent"></div>
    <div class="absolute inset-0 bg-grid-lines opacity-40 mix-blend-overlay"></div>
  </div>

  <div class="relative mx-auto flex max-w-7xl flex-col items-start px-4 py-28 sm:px-6 sm:py-36 lg:px-8">
    <span class="mb-5 inline-flex items-center rounded-sm border border-accent px-3.5 py-1.5 font-mono text-xs font-bold uppercase tracking-wider text-accent">
      Nova Coleção
    </span>
    <h1 class="max-w-2xl font-display text-5xl font-semibold leading-[0.95] tracking-tight text-white sm:text-7xl">
      Estilo urbano que fala mais alto que
      <span class="text-accent">palavras.</span>
    </h1>
    <p class="mt-6 max-w-lg text-base text-slate-300 sm:text-lg">
      Bermudas, calças, camisas e bonés pensados para quem vive a cidade
      no seu próprio ritmo. Peças com atitude, conforto e caimento
      impecável.
    </p>
    <button
      (click)="scrollToProducts()"
      class="group mt-9 flex items-center gap-2 rounded-sm bg-accent px-7 py-4 text-sm font-bold uppercase tracking-wide text-black transition-all duration-300 hover:bg-white hover:gap-3"
    >
      Ver Coleção
      <lucide-icon [img]="ArrowRight" class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5" />
    </button>

    <div class="mt-14 flex flex-wrap gap-x-8 gap-y-3 border-t border-white/10 pt-6">
      @for (item of trustItems; track item.label) {
        <div class="flex items-center gap-2 text-xs font-medium text-slate-300 sm:text-sm">
          <lucide-icon [img]="item.icon" class="h-4 w-4 text-accent" />
          {{ item.label }}
        </div>
      }
    </div>
  </div>
</section>
