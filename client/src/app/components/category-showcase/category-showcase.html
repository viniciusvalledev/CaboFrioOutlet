<section class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
  <div class="flex gap-4 overflow-x-auto pb-2 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    @for (item of items; track item.value) {
      <button
        (click)="handleClick(item.value)"
        class="group flex w-36 flex-shrink-0 flex-col overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 text-left transition-colors duration-300 hover:border-slate-600 sm:w-40"
      >
        <div class="relative h-36 w-full overflow-hidden sm:h-40">
          <img
            [src]="item.image"
            [alt]="item.label"
            loading="lazy"
            class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent"></div>
        </div>
        <div class="flex flex-col gap-2 px-3 pb-3 pt-2">
          <span class="text-sm font-black uppercase tracking-tight text-white">
            {{ item.label }}
          </span>
          <span class="w-full rounded-full bg-white py-1.5 text-center text-[10px] font-bold uppercase tracking-wide text-black transition-colors duration-300 group-hover:bg-yellow-400">
            Confira
          </span>
        </div>
      </button>
    }
  </div>
</section>
